services:
  breeding-vat-ui:
    image: breeding-vat-ui:latest
    container_name: breeding-vat-ui
    stdin_open: true
    tty: true
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${PWD}:/app
    ports:
      - "8501:8501"
    command: streamlit run /app/breeding_vat/ui/app.py --server.address=0.0.0.0
    networks:
      - breeding-vat-net

  jupyter:
    image: breeding-vat-ui:latest
    container_name: breeding-vat-jupyter
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      JUPYTER_ENABLE_LAB: 'yes'
    volumes:
      - ${PWD}:/app
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    networks:
      - breeding-vat-net
    profiles: [ "dev" ]

networks:
  breeding-vat-net:
    driver: bridge
